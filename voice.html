<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice to WhatsApp</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/voice.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h2>Voice to WhatsApp</h2>
        
        <div class="voice-controls">
            <button class="btn btn-primary" onclick="startListening()" id="startBtn">
                <i class="fas fa-microphone"></i> Start Speaking
            </button>
            <button class="btn btn-danger" onclick="stopListening()" id="stopBtn" disabled>
                <i class="fas fa-stop"></i> Stop
            </button>
        </div>

        <div class="voice-text-container">
            <p id="voiceText" contenteditable="true" onfocus="enableEditing()" onblur="disableEditing()">
                Your message will appear here...
            </p>
        </div>
        

        <div class="whatsapp-input align-items-center">
            <input type="text" id="phoneNumber" placeholder="Enter WhatsApp number">
            <button class="btn btn-primary " onclick="sendWhatsApp()">
                <i class="fab fa-whatsapp"></i> Send on WhatsApp
            </button>
        </div>

        <div class="status-indicator" id="statusIndicator"></div>
    </div>

    <script src="js/voice.js"></script>
</body>
</html>
